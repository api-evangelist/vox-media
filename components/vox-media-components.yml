- family: Comment counts
  description: Script-injected comment-count widgets for story listings and article pages.
  docs: https://docs.coralproject.net/counts
- family: AMP support
  description: Support for rendering Coral comments on AMP pages.
  docs: https://docs.coralproject.net/amp
- family: Rich text editor
  description: The Coral Rich Text Editor used in the comment stream, published as @coralproject/rte on npm.
  docs: https://www.npmjs.com/package/@coralproject/rte
