apis:
- name: Coral GraphQL API
  description: >-
    Coral by Vox Media is an open-source commenting platform. Each self-hosted
    or managed Coral instance exposes a GraphQL API at /api/graphql covering
    stories, comments, users, sites, moderation queues, webhooks, and tokens.
    Direct API integration is limited to administrative users authenticating
    with a Bearer access token created via coral-cli.
  humanURL: https://docs.coralproject.net/api/schema
  baseURL: https://{coral_domain}/api/graphql
