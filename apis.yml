aid: vox-media
name: Vox Media
description: >-
  Vox Media is a modern media company whose networks include The Verge, Vox,
  New York Magazine, SB Nation, Eater, Polygon, The Cut, and Vulture. Its
  developer-facing surface centers on Coral (Coral by Vox Media), the
  open-source commenting and community-moderation platform used by more than
  500 newsrooms in 28 countries, which exposes a GraphQL API, HMAC-signed
  webhooks, an embeddable comment stream, and the coral-cli developer tool.
